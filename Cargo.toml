[package]
name = "vision"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Takes a ticket from a tracker to a pull request that is ready to merge."
publish = false

[lib]
name = "vision"
path = "src/lib.rs"

[[bin]]
name = "vision"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
libc = "0.2.191"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
toml = "1.2.1"
toml_edit = "0.25.19"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
