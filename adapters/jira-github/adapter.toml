# The adapter for Jira Cloud and GitHub (design sections 11 and 12).
#
# It reads tickets from Jira Cloud (REST v3), pushes the branch of a ticket and opens a draft pull
# request on GitHub, starts and reads GitHub Actions runs, merges a commit into the branch of a
# staging env, and reads and answers review comments. The vision binary answers the calls
# observe, act, and job of this adapter (`scripts = "builtin:jira-github"` below), so it needs
# no Python and no bin/ folder. It runs git, and `vision app-token` runs openssl. Each HTTP call
# has a time limit; a token goes only over https.
#
# ---------------------------------------------------------------------------------------------
# The [adapter] table of config.toml. A key with no default is needed by the calls that name it;
# such a call fails with a text that names the key.
#
#   jira_url               The Jira site, such as "https://example.atlassian.net".
#   jira_user              The email of the Jira account of JIRA_TOKEN.
#   queue_jql              The JQL of the queue, such as
#                          "project = DEMO AND status = \"To Do\" ORDER BY rank".
#   queue_limit            The most issues that the queue reads. Default 100.
#   github_repo            "owner/name", such as "acme/widgets".
#   github_api             The REST address. Default "https://api.github.com".
#   git_remote_url         The address that git.push pushes to. Default
#                          "https://github.com/<github_repo>.git" when github_api is the default.
#                          It must be https, or a local path (for tests).
#   base_branch            Optional. The branch that pull requests go into. The default comes
#                          from `base` below: the text after its first `/`, such as main of
#                          origin/main. Set it only when the branch on GitHub has a different
#                          name than the remote branch of `base`.
#   ci_workflow            The file name of the CI workflow, such as "ci.yml". It needs the
#                          trigger workflow_dispatch, so that ci.run can start it.
#   ci_find_seconds        How long ci.run looks for the new run before it answers uncertain.
#                          Default 20. Keep it well below the timeout of ci.run.
#   ci_poll_seconds        The pause between two looks. Default 3.
#   approvers              The GitHub logins whose approval counts. Default []: each reviewer
#                          who is not in own_logins counts.
#   approvals_needed       The approvals that make review.state "approved". Default 1.
#   own_logins             The logins of the person and of the bot. A comment of one of them
#                          never waits: an inline thread whose last comment is from one of them
#                          does not wait, and a review or a conversation comment waits until one
#                          of them answers it. review.reply and the job comments need this key.
#   ignore_logins          The logins whose comments never wait for an answer, such as a CI bot
#                          that posts a status comment. Default []. Do not name a reviewer here.
#                          An entry can also be <login>:<kind>, with the kind inline, review, or
#                          conversation, such as "review-bot[bot]:conversation": then only the
#                          comments of that kind of that login never wait, and its reviews and
#                          inline comments still do. An entry splits at its last `:`, because a
#                          login can hold `[`, `]`, and `-`. Another kind is an error.
#   bot_logins             The logins of bots for review.resolve and review.minimize. A login
#                          that ends with [bot] is always a bot. Default []. Name a review bot
#                          here when its login has no [bot] at the end. These two verbs touch
#                          only a thread or a comment of a bot.
#   statuses               A table from a role to the status name of the project, such as
#                          { in_progress = "In Progress", in_review = "In Review" }. tracker.move
#                          takes the role. The steps below use in_progress and in_review.
#   envs                   The staging envs: [{ name = "staging", branch = "staging" }]. observe
#                          tells for each one whether its branch holds the head; deploy merges
#                          into its branch. Default []. An env can also name `deployment`, a
#                          GitHub environment where the project records a deployment when the
#                          env runs a commit, such as { name = "staging", branch = "staging",
#                          deployment = "staging" }. For such an env, observe reads the newest
#                          deployment of that environment (one call, no deployment status) and
#                          gives envs.<name>.deployed (true when the commit of the deployment
#                          holds the head: the same test as holds), deployment_sha, and
#                          deployed_at. With no deployment yet, deployed is false and the two
#                          others are null. An env with no `deployment` key has none of the three,
#                          so a watch of envs.<name>.deployed reads none there.
#   test_command           The command of the proof. It runs with one test file as its last
#                          argument: `sh -c '<test_command> "$@"' sh <file>`, in a plain
#                          environment with no secret, such as "python3 -m pytest -q".
#   test_glob              The test files: a glob or a list of globs, such as
#                          ["tests/**/test_*.py"]. `**/` is any number of folders.
#   test_timeout           Seconds for one test run. Default 600.
#   setup_command          Optional. A shell command that runs in the temporary worktree of the
#                          base commit before its tests, such as a link to the dependencies of
#                          the clone ($VISION_CLONE names the clone). Default: none.
#   test_canary            Optional. One test file, or a list of test files, that exist on the
#                          base commit and pass there, such as one fast test for each test
#                          runner of the project. After setup_command, the proof runs each one
#                          with test_command in the worktree of the base commit, before the
#                          changed tests. A canary that is missing there or that fails means that
#                          the worktree cannot run tests (such as a missing dependency): the proof
#                          does not hold, its check proof-canary has the cause env, no changed
#                          test runs on the base, and the detail names the canary and asks to fix
#                          setup_command. A changed test file is never a canary: the proof skips
#                          it and says so in proof.txt. Without test_canary, a failure of a
#                          changed test on the base can also come from a broken setup, and the
#                          detail of the proof ends with a note that no canary guards that run.
#   lint_command           Optional. Runs with the changed files as its arguments. Default: none.
#   app_start_command      The shell command that starts the app of the clone for QA.
#   app_health_url         The address that answers when the app is up, such as
#                          "http://localhost:3000/health".
#   app_url                The address that the tester opens. Default: the scheme, host, and
#                          port of app_health_url.
#   app_start_timeout      Seconds that app-start waits for app_health_url. Default 120.
#   app_restart            true or false. Default true. app-start remembers the app that it
#                          started: a state file in the temporary folder, named by a hash of the
#                          clone and the env, with the process id, the start time of that
#                          process, the head commit, and the log. When that app still runs and
#                          the head commit changed, app-start stops its process group and
#                          starts the app again at the new head, so that QA after a fix tests
#                          the new code. Set false for an app that loads new code by itself.
#                          An app that answers and that Vision did not start is left as it is,
#                          and the detail says that it can run older code. app-start never
#                          stops a process whose start time differs from the state file. It
#                          trusts the state file only when it is a plain file of this user that
#                          no other user can write, because a temporary folder can be shared.
#                          app-<env>.json names the head of the app and whether it restarted.
#   second_review_command  Optional. A command that reviews the diff. It gets the range
#                          "<base>..<head>" as its last argument and prints its findings.
#                          With no command, the job gives no document, and the review turn gets
#                          null for second-review.md.
#   second_review_timeout  Seconds for it. Default 1100.
#   log_tail_kb            The kilobytes that ci-log keeps of the end of each failed job log.
#                          Default 64.
#   http_timeout           Seconds for one HTTP call. Default 30.
#
# The secrets of [secrets] in config.toml. The executor gives them to the calls observe and act,
# and to the jobs ci-log and comments. A child process that runs code of the project never gets
# one. A token never goes into a file, a remote address, or the git configuration of a clone:
# git.push gives FORGE_TOKEN to one git call as a header for git_remote_url only.
#
#   JIRA_TOKEN   An API token of the Jira account jira_user: read and edit the issues of the
#                project, and move them.
#   FORGE_TOKEN  A GitHub token for pushes, runs, merges, replies, review requests, and the
#                review threads and comments that review.resolve and review.minimize change.
#   PR_TOKEN     Optional. A token of the person, used only to open the draft pull request, so
#                that the person is its author. FORGE_TOKEN opens it when PR_TOKEN is missing.
#
# Such as:
#   [secrets]
#   JIRA_TOKEN  = { cmd = "security find-generic-password -s vision-jira -w" }
#   FORGE_TOKEN = { cmd = "vision app-token --app-id 123 --installation-id 456 --key-file ~/.keys/app.pem" }
#
# `vision app-token` prints an installation token of a GitHub App (see `vision app-token
# --help`). With --key-command in place of --key-file, the key comes from the standard output of
# a command (the PEM text, or the PEM text as one base64 line), and it never goes into a file.
#
# ---------------------------------------------------------------------------------------------
# The path of a ticket. A wait step moves on a fact of observe, and the step qa moves on its
# findings:
#
#   refine -> plan -> plan-ready -> build -> review -> qa
#   qa:        QA on the local app. A kept bug in qa.md -> fix-qa -> review (each fix is
#              reviewed and tested again); no kept bug -> open-pr
#   open-pr:   an act step, with no turn: git.push pushes the branch, then pr.open opens the
#              draft pull request with pr.md -> ci
#   ci:        green -> ready, red -> ci-rerun (the failed jobs run once more)
#   ci-rerun:  green -> ready, red -> fix-ci -> ci
#   ready:     the person marks the pull request ready -> in-review
#   in-review: review.state approved -> ready-to-merge, changes or comments -> comments,
#              conflict -> merge-base-review, merged -> done
#   comments:  the Shepherd fixes and answers the comments. git.push, then review.reply
#              -> ci-review
#   ci-review: CI runs at the new head. green -> rerequest, red -> fix-ci-review -> ci-review
#   rerequest: an act step, with no turn: review.rerequest asks the reviewers again
#              -> in-review
#   ready-to-merge: merged -> done, changes or comments -> comments (a late round takes the
#              same path), conflict -> merge-base-ready
#   merge-base-review, merge-base-ready: Merger merges the base branch into the branch.
#              git.push, then ci.run -> back to in-review or ready-to-merge
#
# Nothing leaves the machine before the review and the local QA hold: the commits of build,
# review, and fix-qa stay in the clone until open-pr. The steps after open-pr push their own
# commits: fix-ci, comments, and fix-ci-review name git.push in after.
#
# A round of comments never goes back to the review, the QA, or open-pr. The reviewers are
# asked again only after CI is green at the new head. A red run goes to fix-ci-review, and its
# commit goes through CI again.
#
# review.state is the first value that holds of: merged, closed, comments (a comment waits),
# changes (a reviewer asks for changes and is not asked again), conflict (the open pull request
# conflicts with its base), approved, and waiting. in-review and ready-to-merge send conflict to
# a merge step. Its job base-merge fetches the base branch into the base ref, such as
# origin/main, and starts the merge of its tip into the branch in the clone, with no commit. The
# job writes base-merge.md with each file with a conflict. Merger resolves the conflicts and
# commits the merge in the clone. Then the proof runs, git.push pushes the branch, ci.run starts
# CI at the new head, and the ticket goes back to the step that it came from. The cap merge
# stops the fourth merge of the base in a ticket. A conflict that needs a decision of the
# person ends the turn of Merger with questions. A wait step with no `conflict` in `on` gives
# the ticket the flag needs-you at once, with the value in the reason.
#
# Each turn step of a loop has a cap: fix-ci and fix-ci-review (ci_fix), qa and fix-qa
# (qa_fix), review (review_rounds). comments has no cap: a requested change that it refuses in
# caps.refusals rounds asks the person with a card. Each wait step names the values that mean
# "not yet" in `wait`, and its `limit` in seconds: any other value, or a longer wait, needs
# the person.
#
# The proof gets the approved plan in args.plan. A line `Proof: green` of the plan declares the
# whole proof green (a change with no new behavior), and a line `Proof: green <path>` declares
# one test file, which then only has to pass at the head.
#
# tracker.move has `once = true`: it moves a ticket one time for each status, whatever the
# commit. The read verbs say in `about` what they give; each turn finds them in its facts file.
#
# ---------------------------------------------------------------------------------------------
# The rules of a continue: the [[resume]] table after the steps. While a ticket is stopped or
# paused, the person can do steps by hand, such as the QA, the pull request, or a round of
# comments. A continue first reads each fact of the ticket: one call of observe (the tracker,
# the pull request, the review, CI, and each env), and the head of the pull request against
# the clone. Then it reads the rules in order, and it suggests the step of the first rule that
# applies. Vision only suggests that step, and the card of the app and the output of a plain
# `vision take KEY` list each fact that it read. The person takes the suggestion or picks
# another step in the continue card (Enter on a stopped or paused ticket), or runs
# `vision take KEY --step STEP`. A plain `vision take KEY` prints the suggestion and exits
# with code 1 when it names another step. A plain `vision retry KEY`, a tick, and a turn run
# no rule.
#
# `when` maps a path to a value or a list of values. Each path must give one of its values. A
# value is a string, true, or false; write a number as a string, such as "0". A path that the
# answer does not have, and a null, give "none", so no rule on pr holds before a pull request
# exists. The paths are those of the answer of observe, as for `watch`: tracker_status (the
# status name of the Jira issue, such as "In Review"), pr.draft, pr.merged, pr.closed (closed
# and not merged), pr.conflict, pr.changes_requested, pr.comments_waiting, review.state,
# ci.state, and envs.<name>.holds and envs.<name>.deployed. One more path comes from Vision:
# head.state, the head of the open pull request against the branch of the clone, after a
# fetch. Its values: none (no open pull request), same, forward (the pull request has later
# commits, such as a push by hand, also when it went on without commits of Vision that no push
# sent), ahead (the clone has commits that the pull request does not have), behind (the commit
# is not in the clone, also after the fetch), apart, dirty (the work tree has changes),
# elsewhere (the clone is on another branch), and unread.
#
# The search reads the rules in order. A rule that holds and names the stored step ends the
# search: the facts confirm the step where the ticket is. A rule that holds and names a step
# after the stored step applies: the step list has its step later, and the links of the steps
# lead there (in a loop, such as in-review, comments, ci-review, and rerequest, the step list
# decides). A rule that holds and names another step applies only with `back = true`: a move
# back, such as from ready-to-merge to comments for a late comment. Without `back`, the search
# skips the rule and reads the next one. When no rule applies, Vision suggests nothing and
# names the rules that held. The move is a new visit that does not count for the cap of its
# step.
#
# The rules below find the code review. A ticket that stopped at review or qa while the person
# opened the pull request goes on at in-review, or at comments when a comment or a change
# request waits, not at its review again. A late comment takes a ticket back to comments, also
# after the approval or a deploy. A push by hand takes it to ci-review: CI at the new head,
# then a new review. An approval with no comment that waits takes a ticket that stopped after
# in-review, such as at comments, on to ready-to-merge, as in-review does. A merged pull
# request goes to done.
#
# The same rules find the step of a ticket that is in progress outside Vision: the queue gives
# its branch with the key, and its open pull request. The start card of Home, or a plain
# `vision take KEY`, reads its facts with that branch, from the first step, and with no head
# state, because Vision has no clone of it yet. A rule that names done suggests nothing.
# `vision take KEY --step STEP` takes the ticket at STEP, on its branch.
#
# When the pull request is open, a continue also compares its head with the branch in the
# clone. When the clone does not have the head, such as after a push of the person from another
# checkout, the continue fetches first. When the head is a later commit of the branch, the
# branch of the clone moves forward to it, and the ticket row takes it as its head, and the
# number of the pull request when the row names none. When the pull request went on without
# commits of Vision that no push sent, such as a fix whose push a gate refused, the branch moves
# to its head, and refs/vision/kept/<branch>/<commit> keeps the old tip. When the commit is
# still missing after the fetch, or the branch went another way with a commit of a person,
# nothing moves: the ticket gets the flag needs-you with the reason and the fix.
#
# With no [[resume]] table, a continue starts the stored step again and runs no observe.
#
# ---------------------------------------------------------------------------------------------
# A project with staging envs writes its own adapter.toml in $VISION_HOME/adapters/<name>/,
# with `scripts = "builtin:jira-github"`, so that the vision binary answers its calls. Its
# folder needs no other file. It copies the steps below and adds three steps for each env, such
# as staging, with
# envs = [{ name = "staging", branch = "staging", deployment = "staging" }] in the [adapter]
# table:
#
#   [[step]]                      # ci and ci-rerun then have green = "deploy-staging" in `on`
#   id = "deploy-staging"
#   kind = "wait"
#   start = [{ verb = "deploy", args = { env = "staging" } }]
#   watch = "envs.staging.holds"
#   on = { "true" = "deployed-staging" }
#   wait = ["false", "none"]
#   interrupt = { "review.state" = { comments = "comments", changes = "comments" } }
#   conflict = "merge-staging"    # a head that does not merge into the branch: Merger resolves it
#   limit = 3600
#
#   [[step]]                      # Merger resolves the conflict, and deploy.merge commits and pushes the merge
#   id = "merge-staging"
#   kind = "turn"
#   agent = "merger"
#   turn = "worker"
#   reads = ["deploy-conflict.md"]
#   expects = ["doc:merge.md"]
#   after = [{ verb = "deploy.merge", args = { env = "staging" } }]
#   next = "deployed-staging"
#
#   [[step]]                      # the env runs the head: its newest deployment holds it
#   id = "deployed-staging"
#   kind = "wait"
#   watch = "envs.staging.deployed"
#   on = { "true" = "qa-staging" }
#   wait = ["false"]
#   interrupt = { "review.state" = { comments = "comments", changes = "comments" } }
#   limit = 3600
#
#   [[step]]
#   id = "qa-staging"
#   kind = "turn"
#   agent = "tester"
#   turn = "tester"
#   reads = ["approved-plan.md"]
#   with = { env = "staging", url = "https://staging.example.com" }
#   expects = ["doc:qa.md"]
#   findings = "qa"
#   on = { findings = "fix-qa", none = "ready" }
#   cap = "qa_fix"
#
# A bug on the env then goes the same way as a local bug: fix-qa, the review, QA on local, the
# push of open-pr, CI, a new deploy of the new commit, and QA on the env again. The deploy needs
# the branch on GitHub, so the steps of an env come after open-pr.
#
# A wait step can have `interrupt`: a path of observe -> a value of that path -> the step where
# the ticket goes. Each look of the step reads the interrupts first, from the same answer of
# observe, and then `watch`. So a late comment during a deploy takes the ticket to comments at
# that tick, and it does not wait for a later step that watches review.state. The move counts
# as an entry of its step, as a move of `on` does, and its event names the interrupt. With
# several paths, the paths are read in their sorted order, and the first value that names a
# step wins. The answer of observe of this adapter always holds review.state, so an interrupt
# on it costs no call.
#
# `conflict` of a wait step names the step where the ticket goes when a start verb failed on a
# merge conflict. When GitHub cannot merge the head into the branch of the env, deploy fetches
# the tip of that branch, makes the git worktree .vision/merge/<env> inside the clone at that
# tip, starts the merge there with no commit, and writes deploy-conflict.md. Merger resolves
# each conflict in the files of that folder. The sandbox of a turn cannot write the git folder
# of a worktree, so deploy.merge stages those files, commits the merge, and pushes it as a
# fast-forward of the branch. It refuses a conflict marker left in a file of the list, a change
# to a file with no conflict, a merge whose parents are not the tip and the head, and a branch
# that moved.
# With no `conflict`, such a failure sets the flag needs-you, and the merge waits in its folder
# for the person.
#
# `envs.staging.holds` is true when the staging branch holds the head commit. It says that the
# merge happened, not that the env already runs the new code. `envs.staging.deployed` says
# that: the newest deployment of the GitHub environment of the env holds the head. A project
# whose env records no deployment leaves out the key `deployment` and the step deployed-staging,
# and its deploy-staging step moves to qa-staging.
#
# The rules of a continue read the order of the step list, so such a project puts the three
# steps after fix-ci and before ready. It can add two rules for them before the rule with
# "pr.draft" = true:
#
#   [[resume]]                    # the env runs the head: the QA on the env is next
#   when = { "envs.staging.deployed" = true, "pr.draft" = true, "pr.closed" = false }
#   step = "qa-staging"
#
#   [[resume]]                    # the staging branch holds the head: the deploy is next
#   when = { "envs.staging.holds" = true, "pr.draft" = true, "pr.closed" = false }
#   step = "deployed-staging"

name = "jira-github"
branch = "vision/{key}"
base = "origin/main"
scripts = "builtin:jira-github"   # the vision binary answers observe, act, and job

[[step]]
id = "refine"
kind = "turn"
agent = "scout"
turn = "reader"
reads = ["issue.json"]
expects = ["doc:refine.md", "doc:description.md"]
after = [{ verb = "tracker.describe", args = { text = "{doc:description.md}", seen = "{doc:issue.json}" } }]
next = "plan"

[[step]]
id = "plan"
kind = "turn"
agent = "builder"
turn = "reader"
reads = ["issue.json", "refine.md", "answers.md"]
expects = ["doc:plan.md"]
next = "plan-ready"

[[step]]
id = "plan-ready"
kind = "human"
action = "approve-plan"
next = "build"

[[step]]
id = "build"
kind = "turn"
agent = "builder"
turn = "worker"
before = [{ verb = "tracker.move", args = { status = "in_progress" } }]
reads = ["approved-plan.md", "refine.md", "answers.md"]
expects = ["commits", "clean", "doc:pr.md", { job = "proof", args = { plan = "{doc:approved-plan.md}" } }]
next = "review"

[[step]]
id = "review"
kind = "turn"
agent = "reviewer"
turn = "worker"
before = ["job:second-review"]
reads = ["approved-plan.md", "second-review.md"]
expects = ["clean", "doc:review.md", { job = "proof", args = { plan = "{doc:approved-plan.md}" } }]
findings = "review"
cap = "review_rounds"
next = "qa"

[[step]]
id = "qa"
kind = "turn"
agent = "tester"
turn = "tester"
before = [{ job = "app-start", args = { env = "local" } }]
reads = ["approved-plan.md", "app-local.json"]
with = { env = "local" }
expects = ["doc:qa.md"]
findings = "qa"
on = { findings = "fix-qa", none = "open-pr" }   # a kept bug of qa.md, or none
cap = "qa_fix"

[[step]]
id = "fix-qa"
kind = "turn"
agent = "builder"
turn = "worker"
reads = ["qa.md", "approved-plan.md"]
with = { env = "local" }
expects = ["clean", "doc:fix-notes.md"]
cap = "qa_fix"
next = "review"               # each fix is reviewed and tested again before the push

[[step]]                      # {doc?:pr.md}: a ticket taken from outside has no pr.md, and pr.open
id = "open-pr"                # needs no text while its pull request is open
kind = "act"
run = ["git.push", { verb = "pr.open", args = { text = "{doc?:pr.md}" } }]
next = "ci"

[[step]]
id = "ci"
kind = "wait"
start = ["ci.run"]
watch = "ci.state"
on = { green = "ready", red = "ci-rerun" }
wait = ["running", "none"]
limit = 7200
every = 60

[[step]]
id = "ci-rerun"
kind = "wait"
start = ["ci.rerun"]
watch = "ci.state"
on = { green = "ready", red = "fix-ci" }
wait = ["running", "none"]
limit = 7200
every = 60

[[step]]
id = "fix-ci"
kind = "turn"
agent = "builder"
turn = "worker"
before = ["job:ci-log"]
reads = ["ci-log.txt", "approved-plan.md"]
expects = ["commits", "clean", { job = "proof", args = { plan = "{doc:approved-plan.md}" } }]
after = ["git.push"]
cap = "ci_fix"
next = "ci"

[[step]]
id = "ready"
kind = "wait"
start = [{ verb = "tracker.move", args = { status = "in_review" } }]
watch = "pr.draft"
on = { "false" = "in-review" }
wait = ["true"]
limit = 604800
every = 120

[[step]]
id = "in-review"
kind = "wait"
watch = "review.state"
on = { approved = "ready-to-merge", changes = "comments", comments = "comments", conflict = "merge-base-review", merged = "done" }
wait = ["waiting"]
limit = 1209600
every = 120

[[step]]
id = "comments"
kind = "turn"
agent = "shepherd"
turn = "worker"
before = ["job:comments"]
reads = ["comments.json", "approved-plan.md", "refusals.json"]
expects = ["clean", "doc:verdicts.json"]
after = [
  "git.push",
  { verb = "review.reply", args = { verdicts = "{doc:verdicts.json}" } },
]
next = "ci-review"

[[step]]
id = "ci-review"
kind = "wait"
start = ["ci.run"]
watch = "ci.state"
on = { green = "rerequest", red = "fix-ci-review" }
wait = ["running", "none"]
limit = 7200
every = 60

[[step]]
id = "fix-ci-review"          # a CI fix in code review goes to CI again, never to the review
kind = "turn"
agent = "builder"
turn = "worker"
before = ["job:ci-log"]
reads = ["ci-log.txt", "approved-plan.md"]
expects = ["commits", "clean", { job = "proof", args = { plan = "{doc:approved-plan.md}" } }]
after = ["git.push"]
cap = "ci_fix"
next = "ci-review"

[[step]]
id = "rerequest"
kind = "act"
run = ["review.rerequest"]    # only after CI is green at the head of the round
next = "in-review"

[[step]]
id = "ready-to-merge"
kind = "wait"
watch = "review.state"
on = { merged = "done", changes = "comments", comments = "comments", conflict = "merge-base-ready" }
wait = ["approved", "waiting"]
limit = 1209600
every = 120

[[step]]                      # the pull request conflicts with its base: Merger merges the base in
id = "merge-base-review"
kind = "turn"
agent = "merger"
turn = "worker"
before = ["job:base-merge"]
reads = ["base-merge.md", "approved-plan.md"]
expects = ["commits", "clean", "doc:merge.md", { job = "proof", args = { plan = "{doc:approved-plan.md}" } }]
after = ["git.push", "ci.run"]
cap = "merge"
next = "in-review"

[[step]]                      # the same merge for a pull request that waits for its merge
id = "merge-base-ready"
kind = "turn"
agent = "merger"
turn = "worker"
before = ["job:base-merge"]
reads = ["base-merge.md", "approved-plan.md"]
expects = ["commits", "clean", "doc:merge.md", { job = "proof", args = { plan = "{doc:approved-plan.md}" } }]
after = ["git.push", "ci.run"]
cap = "merge"
next = "ready-to-merge"

[[step]]
id = "done"
kind = "end"

# The rules of a continue (see the comment block at the top). The first rule that applies wins.

[[resume]]                    # the pull request is merged
when = { "pr.merged" = true }
step = "done"

[[resume]]                    # a comment or a change request waits, also after the approval
when = { "review.state" = ["comments", "changes"] }
step = "comments"
back = true

[[resume]]                    # a push by hand: CI at the new head, then a new review
when = { "head.state" = "forward", "pr.closed" = false }
step = "ci-review"
back = true

[[resume]]                    # the pull request is open and ready
when = { "pr.draft" = false, "pr.closed" = false }
step = "in-review"

[[resume]]                    # approved, and no comment waits: as in-review, the merge is next
when = { "review.state" = "approved", "pr.closed" = false }
step = "ready-to-merge"

[[resume]]                    # the pull request is open and still a draft
when = { "pr.draft" = true, "pr.closed" = false }
step = "ci"

# The verbs. A verb with `leaves` sends text or code out, so the gates of the core run first.
# Each write verb starts in the mode auto: Vision asks for no approval. `vision demote VERB`
# moves a verb down the ladder, such as to the mode ask, and [modes] of config.toml keeps it.

[verbs."tracker.describe"]
mode = "auto"
leaves = true

[verbs."tracker.move"]
mode = "auto"
once = true                   # one move for each status in a ticket, whatever the commit

[verbs."git.push"]
mode = "auto"
leaves = true
timeout = 600

[verbs."pr.open"]
mode = "auto"
leaves = true

[verbs."ci.run"]
mode = "auto"
timeout = 120

[verbs."ci.rerun"]
mode = "auto"
timeout = 120

[verbs.deploy]
mode = "auto"
leaves = true
timeout = 1200                # a conflict also fetches the env branch and starts the merge in a worktree

[verbs."deploy.merge"]        # commits and pushes the merge that Merger resolved in .vision/merge/<env>
mode = "auto"
leaves = true
timeout = 600

[verbs."review.reply"]
mode = "auto"
leaves = true

[verbs."review.rerequest"]
mode = "auto"

# review.resolve resolves each review thread that verdicts.json settles. A row settles its
# comment with `settle`: true, "resolved", or "outdated". The verb touches a thread only when
# its first comment is from a bot and each other comment is from a bot or from a login of
# own_logins. A bot has a login that ends with [bot], or a login of bot_logins. The verb refuses
# each other thread, and its answer names that thread. A row of a review or of a conversation
# comment has no thread, so the verb leaves it out. A step runs it after review.reply:
#   { verb = "review.resolve", args = { verdicts = "{doc:verdicts.json}" } }
[verbs."review.resolve"]
mode = "auto"

# review.minimize hides each comment that verdicts.json settles: an inline comment, a review, or
# a conversation comment. GitHub shows it as outdated for "outdated", and as resolved for true
# and "resolved". The verb touches a comment only when its author is a bot. It refuses each
# other comment, and its answer names that comment. It takes the same args as review.resolve.
[verbs."review.minimize"]
mode = "auto"

# The read verbs that a turn can ask for. Each answer carries its result as a document.

[verbs."jira.issue"]
read = true
about = "One Jira issue as issue-<KEY>.json: title, description, status, parent, comments. args: key (default: the ticket)"

[verbs."jira.search"]
read = true
about = "The issues of a JQL query as jira-search.json: key, title, status, type. args: jql, limit (default 20, at most 50)"

[verbs."github.pr"]
read = true
about = "The pull request as pr-<N>.json: its facts, review state, reviews, and comment threads. args: number (default: the pull request of the ticket)"

# review.read gives the escape check of the core (design section 11.6) the first review of a
# login after a time, with its inline comments. [escapes] verb of config.toml names it.
[verbs."review.read"]
read = true
about = "The first review of a login after a time on the pull request, with its inline comments, as review.json. args: reviewer, after (an RFC 3339 time)"

[verbs."ci.log"]
read = true
timeout = 180
about = "The end of the log of each failed job of a CI run as ci-log-<run>.txt. args: run (default: the last run at the head)"

# The jobs. A job gets no secret, because a job can run code that an agent wrote. Only ci-log
# and comments set `secrets = true`: they only read GitHub, and they run no code of the project.
#
# A job can also run a shell command of the person. The adapter.toml of a project names it with
# the key command, and the vision binary runs it:
#
#   [jobs.regression]
#   command = "~/bin/check-regression"   # the shell command
#   doc = "regression.md"                # optional: the document that gets the standard output
#   env = "plain"                        # or "full": the environment of the tick
#   secrets = true                       # optional: each secret of [secrets], by its name
#   timeout = 600                        # seconds. The default is 300.
#
# The command runs with `sh -c` in the clone of the ticket, or in the adapter folder when the
# ticket has no clone. It gets VISION_KEY, VISION_CLONE, VISION_BRANCH, VISION_HEAD, and
# VISION_BASE, so it reads no argument. Exit code 0 passes, and each other code fails. The last
# lines of its standard error are the detail of a failure, with each secret masked. The document
# gets the standard output after a pass and after a failure, so a later turn reads it. The key
# env is plain by default: PATH, HOME, LANG, and TMPDIR. With env = "full", the command gets the
# environment of the tick, for a command that needs the login of the person, such as a cookie
# import that reads the Keychain. A variable that holds a secret stays out of it, unless the job
# has secrets = true. A turn never gets this environment, and only the person writes this table.
# At the time limit, the executor stops the command. A step names the job as any other job:
# before = ["job:regression"], or "job:regression" in expects. A command with the name of a job
# above, such as proof, replaces that job.

# The job precheck runs the lint, the specs, and the migrations of the project on this machine
# before a push, so that a failure shows here and not in CI. A step names it in expects before
# git.push runs: expects = [..., { job = "precheck" }]. Its table holds the commands; each key is
# optional:
#
#   [jobs.precheck]
#   lint = [                             # each lint, with the globs of its files
#     { run = "bundle exec rubocop --format emacs {files}", globs = ["**/*.rb", "**/*.rake", "Gemfile"] },
#     { run = "npx eslint --format unix {files}", globs = ["**/*.{js,jsx,ts,tsx}"] },
#   ]
#   specs = "bin/rspec {files}"          # {files} is the spec files to run
#   specs_map = "rails"                  # "rails" or "": only the changed spec files
#   jest = { run = "npx jest --findRelatedTests {files}", globs = ["**/*.{js,jsx,ts,tsx}"] }
#   migrations = ["bin/rails db:migrate:up VERSION={version}",
#                 "bin/rails db:migrate:down VERSION={version}",
#                 "bin/rails db:migrate:up VERSION={version}"]
#   migrations_env = { RAILS_ENV = "test" }
#   cap = "10m"                          # the cap: cap + cap_per_file x the checked files,
#   cap_per_file = "15s"                 # at most cap_max, for the lint, the specs, and jest
#   cap_max = "30m"
#
# {files} is the changed files of the branch against its base, deleted files left out, filtered
# by the globs of the command, each one quoted for the shell. A command whose globs match no
# changed file does not run. {base} is the base commit, and {version} the version of a migration.
# A lint can also be a plain text, for a lint of each changed file. Each command runs with sh -c in
# the clone, with the environment of a work session ([claude] env and env_pass of config.toml),
# and never with a secret. The executor refuses a command that opens a shell or a console on a
# remote machine or a pod, such as kubectl exec, or that changes the schema of a live database,
# such as gh-ost.
#
# A lint offense counts only on a changed line, in the form path:line[:column]: message (rubocop
# --format emacs, eslint --format unix). A lint that fails and names no offense in that form is
# broken, and the job fails with the end of its standard error. With specs_map = "rails", a
# changed file app/<dir>/<path>.rb runs spec/<dir>/<path>_spec.rb, and lib/<path>.rb runs
# spec/lib/<path>_spec.rb, when that file exists. A spec that fails at the head and whose file the
# branch did not change runs again in a worktree of the base commit, after setup_command and the
# spec files of test_canary. A spec that fails there too is not ours: the job passes and names it.
# Each added file under a folder db/<...migrate...>/ whose name starts with digits (its version),
# outside spec/ and test/, runs the migrations commands in order, with migrations_env. Afterwards,
# each tracked file that they changed, such as db/schema.rb, goes back to the state of the branch.
#
# When the cap stops the specs or jest, the job passes with the note "unfinished: CI is their
# only run". When the cap stops the lint, the job fails as a hang. The red specs on the base and
# the migrations always run to their end, each command bounded by cap. The timeout of the job is
# cap_max + 6 x cap when the table has none. The job writes precheck.md: what ran, the offenses
# on changed lines, the red specs and which are not ours, the migrations, the cap, and what did
# not finish. A turn whose end fact the job failed gets precheck.md in its facts file.

[jobs.proof]
timeout = 3600

[jobs.app-start]
timeout = 300

[jobs.second-review]
timeout = 1200

[jobs.comments]
timeout = 120
secrets = true

[jobs.ci-log]
timeout = 300
secrets = true

# base-merge fetches the base branch with FORGE_TOKEN and starts its merge in the clone. It runs
# git only, with no hook of the project.
[jobs.base-merge]
timeout = 900
secrets = true
